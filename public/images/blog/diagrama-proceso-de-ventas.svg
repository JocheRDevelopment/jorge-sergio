<svg xmlns="http://www.w3.org/2000/svg" role="img" width="432" height="1292" aria-labelledby="t d" font-family="Work Sans, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" viewBox="0 0 432 1292"><title id="t">Diagrama de flujo del proceso de ventas en 7 etapas</title><desc id="d">Diagrama de flujo del proceso de ventas en 7 etapas, de la prospección al seguimiento y postventa. 1. Prospección: ¿tiene el perfil de cliente ideal? Si no, se descarta. 2. Contacto inicial: ¿acepta una reunión? Si no, pasa a una lista de seguimiento. 3. Diagnóstico: ¿califica (necesidad, presupuesto, urgencia, decisor)? Si no, se descarta. 4. Propuesta: ¿hay objeciones? Si no hay objeciones, pasa directo al cierre. 5. Manejo de objeciones: ¿quedan resueltas? Si no, regresa a la propuesta. 6. Cierre: ¿compra? Si no, pasa a una lista de seguimiento. 7. Seguimiento y postventa: los referidos regresan a la etapa 1, prospección.</desc><defs><marker id="a" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="5"><path fill="#b9c2d1" d="m0 0 10 5-10 5z"/></marker><marker id="g" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="10" refY="5"><path fill="#e4c766" d="m0 0 10 5-10 5z"/></marker><style>.b,.d{fill:#142a4a;stroke:#c9a227;stroke-width:2}.d{fill:#0a1728;stroke:#e4c766}.s{fill:none;stroke:#6c7d99;stroke-width:1.5;stroke-dasharray:5 4}.f,.n{fill:none;stroke:#b9c2d1;stroke-width:2;marker-end:url(#a)}.n{stroke:#e4c766;stroke-dasharray:6 4;marker-end:url(#g)}text{text-anchor:middle;dominant-baseline:central;font-size:18px}.bt{font-size:19px;font-weight:600}.bt,.dt{fill:#f7f5f1}.st{fill:#cfd6e0}.no,.si{fill:#e4c766;font-weight:600}.si{fill:#cfd6e0}.l,.si{text-anchor:start}</style></defs><path fill="#0d1b30" d="M0 0h432v1292H0z"/><path d="M167 72v28" class="f"/><path d="M167 184v32" class="f"/><path d="M167 268v28" class="f"/><path d="M167 380v32" class="f"/><path d="M167 464v28" class="f"/><path d="M167 576v32" class="f"/><path d="M167 660v28" class="f"/><path d="M167 772v32" class="f"/><path d="M167 868v28" class="f"/><path d="M167 980v32" class="f"/><path d="M167 1064v28" class="f"/><path d="M167 1176v32" class="f"/><rect width="224" height="52" x="55" y="20" class="b" rx="6"/><text x="167" y="46" class="bt">1. Prospección</text><rect width="224" height="52" x="55" y="216" class="b" rx="6"/><text x="167" y="242" class="bt">2. Contacto inicial</text><rect width="224" height="52" x="55" y="412" class="b" rx="6"/><text x="167" y="438" class="bt">3. Diagnóstico</text><rect width="224" height="52" x="55" y="608" class="b" rx="6"/><text x="167" y="634" class="bt">4. Propuesta</text><rect width="224" height="64" x="55" y="804" class="b" rx="6"/><text x="167" y="825" class="bt">5. Manejo de</text><text x="167" y="847" class="bt">objeciones</text><rect width="224" height="52" x="55" y="1012" class="b" rx="6"/><text x="167" y="1038" class="bt">6. Cierre</text><rect width="224" height="64" x="55" y="1208" class="b" rx="6"/><text x="167" y="1229" class="bt">7. Seguimiento</text><text x="167" y="1251" class="bt">y postventa</text><path d="m167 100 115 42-115 42-115-42Z" class="d"/><text x="167" y="142" class="dt">¿Tiene el perfil?</text><path d="m167 296 115 42-115 42-115-42Z" class="d"/><text x="167" y="338" class="dt">¿Acepta reunión?</text><path d="m167 492 115 42-115 42-115-42Z" class="d"/><text x="167" y="534" class="dt">¿Califica?</text><path d="m167 688 115 42-115 42-115-42Z" class="d"/><text x="167" y="730" class="dt">¿Hay objeciones?</text><path d="m167 896 115 42-115 42-115-42Z" class="d"/><text x="167" y="938" class="dt">¿Resueltas?</text><path d="m167 1092 115 42-115 42-115-42Z" class="d"/><text x="167" y="1134" class="dt">¿Compra?</text><text x="177" y="200" class="si">Sí</text><text x="177" y="396" class="si">Sí</text><text x="177" y="592" class="si">Sí</text><text x="177" y="788" class="si">Sí</text><text x="177" y="996" class="si">Sí</text><text x="177" y="1192" class="si">Sí</text><path d="M282 142h32" class="n"/><path d="M282 338h32" class="n"/><path d="M282 534h32" class="n"/><path d="M282 1134h32" class="n"/><text x="297" y="124" class="no">No</text><text x="297" y="320" class="no">No</text><text x="297" y="516" class="no">No</text><text x="297" y="1116" class="no">No</text><rect width="114" height="44" x="314" y="120" class="s" rx="6"/><text x="371" y="142" class="st">Descartar</text><rect width="114" height="60" x="314" y="308" class="s" rx="6"/><text x="371" y="328" class="st">Lista de</text><text x="371" y="348" class="st">seguimiento</text><rect width="114" height="44" x="314" y="512" class="s" rx="6"/><text x="371" y="534" class="st">Descartar</text><rect width="114" height="60" x="314" y="1104" class="s" rx="6"/><text x="371" y="1124" class="st">Lista de</text><text x="371" y="1144" class="st">seguimiento</text><path d="M282 938h16V634h-19" class="n"/><text x="306" y="926" class="no l">No</text><text x="306" y="826" class="no l">Regresa a</text><text x="306" y="848" class="no l">propuesta</text><path d="M52 730H36v308h19" class="n"/><path fill="#0d1b30" d="M22 776h28v24H22z"/><text x="36" y="788" class="no">No</text><path d="M55 1240H14V46h41" style="fill:none;stroke:#c9a227;stroke-width:2;marker-end:url(#g)"/><path fill="#0d1b30" d="M2 692V588h24v104z"/><text x="14" y="640" class="no" transform="rotate(-90 14 640)">Referidos</text></svg>